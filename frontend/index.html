<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card Generator</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <div class="header-inner">
                <div class="logo">
                    <span class="logo-icon">👤</span>
                    <div>
                        <h1>Profile<span> Generator</span></h1>
                        <p>Create & Manage Profiles</p>
                    </div>
                </div>
                <span class="stats" id="totalProfiles">0 Profiles</span>
            </div>
        </header>

        <!-- Form -->
        <section class="form-section">
            <div class="card">
                <h2>📝 New Profile</h2>
                <form id="profileForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Full Name <span class="required">*</span></label>
                            <input type="text" id="profileName" placeholder="John Doe" required>
                        </div>
                        <div class="form-group">
                            <label>Avatar Color</label>
                            <div class="color-group">
                                <input type="color" id="avatarColor" value="#6C63FF">
                                <div class="color-presets">
                                    <button type="button" class="cp active" data-color="#6C63FF" style="background:#6C63FF"></button>
                                    <button type="button" class="cp" data-color="#FF6B6B" style="background:#FF6B6B"></button>
                                    <button type="button" class="cp" data-color="#4ECDC4" style="background:#4ECDC4"></button>
                                    <button type="button" class="cp" data-color="#45B7D1" style="background:#45B7D1"></button>
                                    <button type="button" class="cp" data-color="#FF8A5C" style="background:#FF8A5C"></button>
                                    <button type="button" class="cp" data-color="#DDA0DD" style="background:#DDA0DD"></button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Bio <span class="required">*</span></label>
                        <textarea id="profileBio" placeholder="Write a short bio..." rows="2" required></textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Skills</label>
                            <input type="text" id="profileSkills" placeholder="JavaScript, React, Node.js">
                            <small>Separate with commas</small>
                        </div>
                        <div class="form-group">
                            <label>Social Links</label>
                            <input type="text" id="profileSocial" placeholder="github.com/username">
                            <small>Separate with commas</small>
                        </div>
                    </div>

                    <button type="submit" class="btn-primary">✨ Generate Profile</button>
                </form>
            </div>
        </section>

        <!-- Profiles List -->
        <section class="profiles-section">
            <div class="section-header">
                <h2>📚 All Profiles</h2>
                <span class="badge" id="profileCount">0</span>
                <button id="refreshBtn" class="btn-refresh">🔄 Refresh</button>
            </div>
            <div id="profilesList" class="profiles-grid">
                <!-- Profiles will be rendered here -->
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
